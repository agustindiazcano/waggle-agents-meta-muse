<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b0e13;font-family:Arial,Helvetica,sans-serif}
#c{position:fixed;inset:0}
.panel{position:fixed;background:rgba(10,14,20,.82);color:#e8eef4;border:1px solid #2b3a4a;border-radius:8px;padding:10px 12px;font-size:15px;line-height:1.45}

#card{position:fixed;inset:12% 16%;display:none;background:rgba(8,12,18,.94);color:#e8eef4;border:1px solid #2b3a4a;border-radius:12px;padding:34px 40px;font-size:20px;line-height:1.6}

.tag.red{background:#3c1212;color:#ff9c9c}.tag.amber{background:#3a2f10;color:#ffd34d}

<canvas id="c"></canvas>
<div class="panel" id="hud"></div>
<div class="panel" id="event"></div>
<div id="subs"></div>
<div id="card"></div>
<div id="close"><h1>Waggle Hive</h1><p>Safety and reliability control plane for LLM-directed robot fleets</p><p>Built with Muse Spark Open</p><p style="font-size:17px">github.com/agustindiazcano/waggle-agents-meta-muse</p></div>
<canvas id="minimap" width="300" height="180" style="position:fixed;left:14px;bottom:9%;background:rgba(10,14,20,.85);border:1px solid #2b3a4a;border-radius:8px"></canvas>
<canvas id="cellmap" width="300" height="180" style="position:fixed;right:14px;bottom:9%;background:rgba(10,14,20,.85);border:1px solid #2b3a4a;border-radius:8px;display:none"></canvas>
<div id="banner"><div class="l">Waggle Hive<br><small>Agentic robot fleet for logistics</small></div><div class="c">Powered by Meta Muse</div><div class="r">Agustin Diaz Cano<br><small>MS Candidate, Systems Engineering</small></div></div>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/":"./vendor/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/GLTFLoader.js';
const q=new URLSearchParams(location.search);
const FIXED=q.has('t')?parseFloat(q.get('t')):null;
const SPEED=parseFloat(q.get('speed')||'1');
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x11161d);scene.fog=new THREE.Fog(0x11161d,180,420);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,600);
scene.add(new THREE.AmbientLight(0xaabbcc,.95));
const sun=new THREE.DirectionalLight(0xffffff,1.6);sun.position.set(60,90,40);sun.castShadow=true;scene.add(sun);
const M=(c,r=.6,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const box=(w,h,d,c,x=0,y=0,z=0,r)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c,r));o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;return o;};
// ground + roads
const ground=new THREE.Mesh(new THREE.PlaneGeometry(460,300),M(0x1a2027,.95));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
for(const z of[-38,38]){const road=box(360,.12,14,0x232a33,0,.06,z,.9);scene.add(road);}
for(const x of[-95,0,95]){const road=box(14,.12,90,0x232a33,x,.06,0,.9);scene.add(road);}
// Meta floor decal texture (placeholder pending official asset, see ASSETS.md)
function metaTexture(){const cv=document.createElement('canvas');cv.width=512;cv.height=256;const g=cv.getContext('2d');g.clearRect(0,0,512,256);g.strokeStyle='rgba(120,180,255,.85)';g.lineWidth=20;g.beginPath();g.moveTo(90,128);g.bezierCurveTo(90,60,170,60,205,128);g.bezierCurveTo(240,196,320,196,320,128);g.bezierCurveTo(320,80,370,70,395,105);g.bezierCurveTo(415,135,400,175,365,178);g.stroke();g.fillStyle='rgba(230,240,255,.9)';g.font='bold 54px Arial';g.fillText('Meta',330,200);const t=new THREE.CanvasTexture(cv);return t;}
const WH=[{x:-95,z:0,n:'WH-A'},{x:0,z:0,n:'WH-B'},{x:95,z:0,n:'WH-C'}];
const racks=[];
for(const w of WH){
  const g=new THREE.Group();g.position.set(w.x,0,w.z);
  g.add(box(56,1,40,0x2e3947,0,.5,0,.9));
  g.add(box(56,4,.6,0x3d4c5e,0,2,-20));g.add(box(56,4,.6,0x3d4c5e,0,2,20));
  g.add(box(.6,10,40,0x2e3947,-28,5,0));g.add(box(.6,10,40,0x2e3947,28,5,0));
  for(let i=-2;i<=2;i++)for(const s of[-1,1]){const r=box(20,5,2.4,0x3a4756,i*0+s*11,2.5,-8+((i+2)%2)*16);g.add(r);racks.push(r);
    for(let k=0;k<4;k++)g.add(box(2.6,1.6,1.8,k%2?0xc9a227:0x7a8794,-19+i*0+s*11+(k-1.5)*4.4,3.6,-8+((i+2)%2)*16));}
  const decal=new THREE.Mesh(new THREE.PlaneGeometry(24,12),new THREE.MeshBasicMaterial({map:metaTexture(),transparent:true,depthWrite:false}));
  decal.rotation.x=-Math.PI/2;decal.rotation.z=Math.PI;decal.position.set(0,1.06,12);g.add(decal);
  const dock=box(18,3,6,0x39434e,0,1.5,23);g.add(dock);
  scene.add(g);
}
// robot builder
function robot(color){const g=new THREE.Group();g.scale.setScalar(1.45);g.add(box(2.2,.9,1.5,color,0,.65,0,.45));
  const top=new THREE.Mesh(new THREE.CylinderGeometry(.32,.32,.5,16),M(0x222a33,.35,.4));top.position.y=1.35;top.castShadow=true;g.add(top);
  for(const s of[-1,1])for(const e of[-1,1]){const wh=new THREE.Mesh(new THREE.CylinderGeometry(.34,.34,.25,14),M(0x14181d,.5));wh.rotation.z=Math.PI/2;wh.position.set(e*.75,.34,s*.62);g.add(wh);}
  const ring=new THREE.Mesh(new THREE.TorusGeometry(2.6,.05,8,40),new THREE.MeshBasicMaterial({color:0x35d07f,transparent:true,opacity:.0}));
  ring.rotation.x=Math.PI/2;ring.position.y=.15;g.add(ring);g.userData.ring=ring;return g;}
const robots=[];
for(let c=0;c<3;c++)for(let i=0;i<10;i++){const org=i===0;const r=robot(org?0xffd34d:0xd7dde3);Object.assign(r.userData,{cell:c,idx:i,org,phase:i*.7+c*2});scene.add(r);robots.push(r);}
// hero package + human + trucks
const hero=robots[13]; // R-B04, carrier of the urgent order
const pkg=box(1.1,.8,.9,0xc9a227,0,0,0,.5);scene.add(pkg);
const human=new THREE.Group();human.add(box(.7,1.8,.45,0xe2574c,0,.9,0,.8));scene.add(human);
function truck(color){const g=new THREE.Group();g.add(box(3,2.4,7,color,0,1.7,0,.4));g.add(box(2.8,2,3,0xe8edf2,0,1.4,5,.4));g.userData.cargo=box(1.4,1.1,1.2,0xc9a227,0,3.4,-1);g.add(g.userData.cargo);return g;}
const trucks=[truck(0x3f6fb5),truck(0x4c9a5f),truck(0xb57a3f)];trucks.forEach(t=>scene.add(t));
// Exterior and human GLB assets supplied by the maintainer in assets/ (see ASSETS.md).
const mixers=[];
function normalized(gltf,size){
 const src=gltf.scene; const bb=new THREE.Box3().setFromObject(src); const sz=bb.getSize(new THREE.Vector3());
 const s=size/Math.max(sz.x,sz.y,sz.z); src.scale.setScalar(s);
 const c=bb.getCenter(new THREE.Vector3()); src.position.set(-c.x*s,-bb.min.y*s,-c.z*s);
 const wrap=new THREE.Group(); wrap.add(src); wrap.traverse(o=>{o.castShadow=true; if(o.material&&o.material.isMeshStandardMaterial){o.material.metalness=0; o.material.roughness=.85;}}); return wrap;
}
function playClip(gltf,wrap,name){
 const clip=gltf.animations.find(a=>a.name===name)||gltf.animations[0]; if(!clip)return;
 const mx=new THREE.AnimationMixer(wrap); mx.clipAction(clip).play(); mixers.push(mx);
}
const workers=[null,null,null,null];
const workerSpots=[[-115,18],[6,-12],[-14,26],[16,-14]]; // WH-A dock, crossing (dynamic), WH-B dock, WH-B machine M-B2
const assetJobs=[];
function loadAsset(file,done){assetJobs.push(new Promise(res=>{new GLTFLoader().load('assets/'+file,g=>{done(g);res(file+':glb');},undefined,()=>res(file+':fallback')); }));}
loadAsset('Blue_Delivery_Truck.glb',gltf=>{
 const m=normalized(gltf,10); const t=trucks[1]; t.add(m);
 t.children.forEach(ch=>{if(ch!==m&&ch!==t.userData.cargo)ch.visible=false;});
});
loadAsset('Shipping_Container.glb',gltf=>{
 const base=normalized(gltf,12);
 for(const w of WH){
  const m=base.clone(true); m.rotation.y=Math.PI/2;
  m.position.set(w.x+36, 0, 28); scene.add(m);
 }
});
for(let i=0;i<4;i++)loadAsset('worker-'+(i+1)+'.glb',gltf=>{
 const m=normalized(gltf,1.8); const spot=workerSpots[i];
 m.position.set(spot[0],0,spot[1]);
 m.rotation.y=i===1?0:Math.PI; scene.add(m); workers[i]=m;
 playClip(gltf,m,i===1?'Walking':'Idle_11');
 if(i===1)human.visible=false;
});
window.__assetsReady=Promise.all(assetJobs).then(r=>r.join(','));
// ghost paths
const ghostMat=new THREE.LineBasicMaterial({color:0x6fd3ff,transparent:true,opacity:0});
const ghosts=[];
for(let k=0;k<3;k++){const pts=[];for(let i=0;i<=30;i++){const a=i/30*Math.PI*(1+k*.4);pts.push(new THREE.Vector3(Math.sin(a)*(10+k*4),1.2,-10+Math.cos(a)*14));}
  const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),ghostMat.clone());l.position.set(0,0,0);scene.add(l);ghosts.push(l);}
const ORDER='ORD-1042',PKG='PKG-8841';
const SUBS=[[0,8,'Three warehouses. Thirty robots. One urgent order.'],[8,15,ORDER+': transfer '+PKG+' from WH-A to WH-C. Priority: urgent.'],[15,25,'One global coordinator assigns the transfer to three cell organizers.'],[25,35,'Each organizer directs ten robots. Thirty advisors add caution; deterministic code decides.'],[35,48,'WH-B organizer assigns pickup. '+PKG+' attaches to carrier R-B04.'],[48,58,'A human crosses the aisle. The fast layer commands a stop. No model is in this loop.'],[58,65,'Clear. Motion resumes inside the allowed envelope.'],[65,78,'A package label tries to add an override instruction.'],[78,90,'Screening, strict schema and tool permissions reject it. The order is unchanged.'],[90,105,'Machine M-B2 reports overheating. Ticket, diagnosis and part reservation open.'],[105,120,'Simulated route variants are reviewed. One safe alternative is selected.'],[120,138,'Truck TRK-07 is delayed. The coordinator reassigns the transfer to TRK-12.'],[138,155,PKG+' is loaded, moved and delivered. '+ORDER+' is complete.'],[155,165,'Measured evidence, from committed result files. Development seeds only.'],[165,180,'Waggle Hive. Models propose. Deterministic code disposes.']];
const EVENTS=[[0,'GLOBAL','Order received: '+ORDER+' / '+PKG], [15,'COORDINATOR','Assigns WH-A > WH-B > WH-C transfer'],[35,'ORGANIZER WH-B','Pickup assigned to R-B04'],[48,'FAST LAYER','Human in envelope: STOP (deterministic)'],[58,'FAST LAYER','Envelope clear: resume'],[65,'GUARD','Untrusted label input screened'],[78,'MCP BOUNDARY','Override rejected: schema + allowlist'],[90,'MAINTENANCE','M-B2 overheating: ticket T-331 opened'],[105,'COURT REVIEW','Ghost routes checked; alternative selected'],[120,'COORDINATOR','TRK-07 delayed: reassign to TRK-12'],[138,'DELIVERY',PKG+' delivered; '+ORDER+' complete']];
const CAM=[[0,0,120,150,0,0,0],[15,0,95,120,0,0,0],[20,-20,45,60,0,0,5],[28,8,18,26,0,1,0],[35,20,7,-14,0,1,-4],[48,18,4,-4,0,1,-4],[58,20,7,-14,0,1,-4],[65,14,5,-10,4,1,-3],[90,-14,16,30,-4,1,-6],[105,0,26,44,0,1,0],[120,0,110,140,0,0,0],[138,80,30,55,95,1,10],[155,0,120,150,0,0,0],[165,0,120,150,0,0,0],[180,0,120,150,0,0,0]];
function camAt(t){let a=CAM[0],b=CAM[CAM.length-1];for(let i=0;i<CAM.length-1;i++){if(t>=CAM[i][0]&&t<=CAM[i+1][0]){a=CAM[i];b=CAM[i+1];break;}}
 const s=(t-a[0])/Math.max(.001,(b[0]-a[0])),e=s*s*(3-2*s);const L=(x,y)=>x+(y-x)*e;
 camera.position.set(L(a[1],b[1]),L(a[2],b[2]),L(a[3],b[3]));camera.lookAt(L(a[4],b[4]),L(a[5],b[5]),L(a[6],b[6]));}
const hud=document.getElementById('hud'),ev=document.getElementById('event'),subs=document.getElementById('subs'),card=document.getElementById('card'),closeEl=document.getElementById('close');
card.innerHTML='<h2>Engineering evidence (development seeds)</h2>E1 fast layer, envelope_oracle: runs with a human collision 13/90 vs 62/90 with no control.<br>E2 admission (S03 component): completed routes 5/5 with admission, 0/5 without. Small sample.<br>E9 planted defects: 4 of 4 killed by existing tests.<br><span style="font-size:16px;color:#b9c6d2">Sources: results/e1/dev/report.md, results/e2/dev/, results/e9/dev/planted.json. Mock demo events are not experiment results.</span>';
const lerp=(a,b,s)=>a+(b-a)*s, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function stateAt(t){
 robots.forEach((r,i)=>{const u=r.userData;if(r===hero)return;const cx=WH[u.cell].x;
  const a=t*.25+u.phase;const rad=u.org?7:13+(u.idx%3)*4;
  r.position.set(cx+Math.sin(a)*rad,1,Math.cos(a*.8)*11);r.rotation.y=a;});
 // hero path in WH-B
 const hx=clamp((t-35)/20,0,1), stop=(t>=48&&t<58)?1:0;
 const hp=stop? .62 : lerp(-16,14,hx); hero.position.set(hp,1,-4); hero.rotation.y=Math.PI/2;
 hero.userData.ring.material.opacity=(t>=35&&t<65)?.75:0; hero.userData.ring.material.color.set(stop?0xff5252:0x35d07f);
 pkg.visible=t>=40; if(t<120){pkg.position.set(hero.position.x,2,hero.position.z);} else if(t<138){const s=(t-120)/18;pkg.position.set(lerp(0,95,s),3.2,lerp(-38,-30,s));} else {pkg.position.set(95,2.2,14);}
 human.visible=t>=42&&t<62&&!workers[1]; human.position.set(6,1,lerp(-6,1,clamp((t-42)/16,0,1)));
 if(workers[1]){workers[1].visible=t>=42&&t<62; workers[1].position.set(6,0,lerp(-6,1,clamp((t-42)/16,0,1)));}
 trucks.forEach((tr,i)=>{const s=((t*.012+i*.33)%1); const x=lerp(-170,170,s); const delayed=(i===0&&t>=120); tr.position.set(delayed?-40:x,1,i===1?38:-38); tr.rotation.y=Math.PI/2; tr.userData.cargo.visible=!(i===0&&t>=120)||t<120;});
 ghosts.forEach((g,k)=>{g.material.opacity=(t>=100&&t<120)?.35+.3*Math.sin(t*3+k):0;});
 const done=t>=138?1:0, transit=(t>=15&&t<138)?1:0;
 hud.innerHTML='<b>WAGGLE HIVE</b><br>Warehouses: 3 &nbsp; Robots: 30<br>Advisors: 30 &nbsp; Organizers: 3 &nbsp; Coordinator: 1<br>Order '+ORDER+' &nbsp; '+PKG+'<br>Delivered: '+done+' &nbsp; In transit: '+transit+' &nbsp; Delayed trucks: '+(t>=120?1:0);
 let cur=EVENTS[0]; for(const e of EVENTS) if(t>=e[0]) cur=e;
 ev.innerHTML='<span class="tag'+(cur[1].includes('FAST')?'':'')+'">'+cur[1]+'</span><br><b>'+cur[2]+'</b>'+(t>=65&&t<90?'<br><span class="tag red">REJECTED</span> forged field + no tool permission':'')+(t>=90&&t<105?'<br><span class="tag amber">TICKET T-331</span> part reserved':'');
 let s=''; for(const x of SUBS) if(t>=x[0]&&t<x[1]) s=x[2]; subs.textContent=s; subs.style.display=s?'block':'none';
 card.style.display=(t>=155&&t<165)?'block':'none'; closeEl.style.display=t>=165?'flex':'none';
 camAt(t);
}
let start=performance.now();
const OFFSET=parseFloat(q.get('offset')||'0');
const clock=new THREE.Clock();
function loop(now){const t=FIXED!==null?FIXED:((now-start)/1000*SPEED+OFFSET)%180; stateAt(t); const d=Math.min(clock.getDelta(),.05); mixers.forEach(m=>m.update(d)); renderer.render(scene,camera); requestAnimationFrame(loop);}
requestAnimationFrame(loop);
const mm=document.getElementById('minimap').getContext('2d'), cm=document.getElementById('cellmap'), cmx=cm.getContext('2d');
const code=r=>{const u=r.userData;return 'R-' + 'ABC'[u.cell] + String(u.idx+1).padStart(2,'0');};
function drawMaps(t){
 mm.clearRect(0,0,300,180); mm.fillStyle='#8fa3b5'; mm.font='11px Arial'; mm.fillText('GLOBAL MAP - live unit positions',8,14);
 WH.forEach((w,i)=>{const x=18+i*96; mm.strokeStyle='#3d4c5e'; mm.strokeRect(x,24,84,120); mm.fillStyle='#cfe0ee'; mm.fillText(w.n,x+4,38);});
 robots.forEach(r=>{const x=60+(r.position.x+140)/280*276, y=34+(r.position.z+55)/110*130;
  mm.fillStyle=r===hero?'#ffd34d':(r.userData.org?'#ffb84d':'#7de2a8'); mm.beginPath(); mm.arc(x,y,r===hero?4:2.5,0,7); mm.fill();
  if(r===hero||r.userData.org){mm.fillStyle='#fff'; mm.font='9px Arial'; mm.fillText(code(r),x+5,y+3);}});
 trucks.forEach((tr,i)=>{const x=60+(tr.position.x+140)/280*276, y=tr.position.z<0?28:150; mm.fillStyle='#6fb7ff'; mm.fillRect(x-4,y-3,8,6);});
 mm.fillStyle='#ffd34d'; mm.font='10px Arial'; mm.fillText(ORDER+'  '+PKG+'  hero: '+code(hero),8,168);
 const local=t>=25&&t<120; cm.style.display=local?'block':'none';
 if(local){cmx.clearRect(0,0,300,180); cmx.fillStyle='#8fa3b5'; cmx.font='11px Arial'; cmx.fillText('WH-B MAP - unit codes and status',8,14);
  cmx.strokeStyle='#3d4c5e'; cmx.strokeRect(14,22,272,140);
  robots.filter(r=>r.userData.cell===1).forEach(r=>{const x=150+(r.position.x)/60*260, y=92+(r.position.z)/46*130;
   const stopped=(r===hero&&t>=48&&t<58); cmx.fillStyle=stopped?'#ff5252':(r===hero?'#ffd34d':'#7de2a8');
   cmx.beginPath(); cmx.arc(x,y,r===hero?5:3.5,0,7); cmx.fill(); cmx.fillStyle='#fff'; cmx.font='9px Arial'; cmx.fillText(code(r)+(stopped?' STOP':''),x+6,y+3);});
  cmx.fillStyle='#c9a227'; cmx.fillRect(146,86,8,8); cmx.fillStyle='#fff'; cmx.font='9px Arial'; cmx.fillText(PKG,158,94);}
}
const _stateAt=stateAt; stateAt=function(t){_stateAt(t); drawMaps(t);};
window.__demo={stateAt,SUBS,workers,robots};
</script></body></html>
