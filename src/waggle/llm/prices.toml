# USD per million tokens for each HTTP route. Maintainer fills these.
# Every entry is unverified until the maintainer reads the number in the provider console,
# writes it here and sets verified = true. While verified is false (or a number is missing)
# the provider refuses real calls. A mock provider needs none of this.
#
# Example once known:
#   [meta]
#   verified = true
#   input_per_mtok = 0.0
#   output_per_mtok = 0.0

# Standard tier (Muse Spark / Muse Wonder), maintainer decision 2026-11-03.
[meta]
verified = true
input_per_mtok = 1.25
output_per_mtok = 4.25

[baseten]
verified = false

[modal]
verified = false
