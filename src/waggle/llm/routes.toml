# Role routing table (ADR-015, ADR-016, ADR-017).
# Model ids are never written here. Each route names the environment variable that
# holds the id, so ids come from the provider model list and can change without code.
# A role without a [roles.<name>.fallback] table has no declared fallback.

[roles.guard]
tier = "fast"
[roles.guard.primary]
provider = "modal"
model_env = "MODAL_GLIMMER_MODEL_ID"
[roles.guard.fallback]
provider = "vertex"
model_env = "VERTEX_MODEL_ID"

[roles.director]
tier = "planning"
[roles.director.primary]
provider = "meta"
model_env = "META_MODEL_ID"

[roles.planner]
tier = "planning"
[roles.planner.primary]
provider = "meta"
model_env = "META_MODEL_ID"

