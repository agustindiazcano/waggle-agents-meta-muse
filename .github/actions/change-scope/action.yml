name: Detect code changes
description: Skip application suites for documentation and workflow configuration updates.
outputs:
  code:
    description: Whether application code, dependencies or non-documentation tests changed.
    value: ${{ steps.scope.outputs.code }}
runs:
  using: composite
  steps:
    - id: scope
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        python3 - <<'PY'
        import os
        import subprocess
        from pathlib import PurePosixPath

        base = os.environ.get("BASE_SHA", "")
        initial = not base or set(base) == {"0"}
        if initial:
            base = f"origin/{os.environ['DEFAULT_BRANCH']}"
        if os.environ["EVENT_NAME"] == "workflow_dispatch" or (
            initial and os.environ["REF_NAME"] == os.environ["DEFAULT_BRANCH"]
        ):
            code = True
        else:
            comparison = (
                f"{base}...{os.environ['HEAD_SHA']}"
                if os.environ["EVENT_NAME"] == "pull_request"
                else f"{base}..{os.environ['HEAD_SHA']}"
            )
            changed = subprocess.run(
                ["git", "diff", "--name-only", "-z", comparison],
                capture_output=True, check=True, timeout=30,
            ).stdout.decode("utf-8").split("\0")

            def needs_suite(name):
                path = PurePosixPath(name)
                if path.suffix == ".md":
                    return False
                if path.parent == PurePosixPath("docs/assets") and path.suffix in {
                    ".html", ".svg", ".png", ".jpg", ".jpeg", ".webp",
                }:
                    return False
                if path.parent == PurePosixPath("tests/unit") and path.match("test_*docs.py"):
                    return False
                if name in {".github/workflows/ci.yml", ".github/workflows/viewer.yml",
                            ".github/actions/change-scope/action.yml"}:
                    return False
                return True

            code = any(needs_suite(name) for name in changed if name)
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            output.write(f"code={str(code).lower()}\n")
        PY
