name: Waggle Hive CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy strict
        run: uv run mypy
      - name: Pytest with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml -m "not heavy and not llm"
      - name: Import contracts
        run: uv run lint-imports
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  protected_paths:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: List protected paths touched by this pull request
        run: |
          git diff --name-only "origin/${BASE_REF}...HEAD" | python3 tools/hooks/protected_report.py >> "$GITHUB_STEP_SUMMARY"
