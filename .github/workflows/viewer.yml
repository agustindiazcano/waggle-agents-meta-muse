name: Waggle Hive viewer

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        uses: ./.github/actions/change-scope

  viewer:
    needs: scope
    if: always() && (needs.scope.result != 'success' || needs.scope.outputs.code == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install viewer development dependencies
        working-directory: web
        run: npm ci
      - name: Viewer unit tests
        working-directory: web
        run: npm test
      - name: Viewer build and types
        working-directory: web
        run: npm run build
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser contract tests
        working-directory: web
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: viewer-browser-failure
          path: web/test-results/
